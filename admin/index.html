<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Edit Ocean Tones Collective</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.17.0/dist/decap-cms.js"></script>
  <script>
    // Floating "Analytics" button, shown once someone is logged in to the editor.
    (function () {
      var link = document.createElement("a");
      link.href = "/admin/stats.html";
      link.textContent = "Analytics";
      link.setAttribute("aria-label", "Open website analytics");
      link.style.cssText = "position:fixed;right:20px;bottom:20px;z-index:99999;display:none;" +
        "padding:10px 18px;border-radius:999px;background:#a64d27;color:#fff;font:600 14px system-ui,sans-serif;" +
        "text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)";
      document.body.appendChild(link);
      function loggedIn() {
        try { return !!(localStorage.getItem("decap-cms-user") || localStorage.getItem("netlify-cms-user")); } catch (e) { return false; }
      }
      function update() { link.style.display = loggedIn() ? "block" : "none"; }
      update();
      setInterval(update, 1000);
    })();
  </script>
  <script>
    // Keep the song list alphabetical by artist (ignoring a leading "The") every time it is saved.
    // This matches how the website sorts it, so the editor and the site always agree.
    (function () {
      if (!window.CMS) return;
      var key = function (s) { return String(s || "").replace(/^the\s+/i, "").toLowerCase(); };
      CMS.registerEventListener({
        name: "preSave",
        handler: function (args) {
          var data = args.entry.get("data");
          var songs = data && data.get("songs");
          if (!songs || !songs.sort) return undefined;
          return data.set("songs", songs.sort(function (a, b) {
            return key(a.get("artist")).localeCompare(key(b.get("artist")), "en") ||
                   key(a.get("title")).localeCompare(key(b.get("title")), "en");
          }));
        }
      });
    })();
  </script>
</body>
</html>
